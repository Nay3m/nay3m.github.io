<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c201a"/>
      <stop offset="60%" stop-color="#143128"/>
      <stop offset="100%" stop-color="#1c3e34"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ecd8b0"/>
      <stop offset="100%" stop-color="#cbb281"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(236, 216, 176, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Topographic contours in background -->
  <g fill="none" stroke="rgba(236, 216, 176, 0.08)" stroke-width="1.8">
    <path d="M-50 200 C200 120 400 280 700 180 S1050 240 1250 150"/>
    <path d="M-50 260 C220 180 430 340 730 240 S1080 300 1250 210"/>
    <path d="M-50 320 C240 240 460 400 760 300 S1110 360 1250 270"/>
    <path d="M-50 380 C260 300 490 460 790 360 S1140 420 1250 330"/>
    <path d="M-50 440 C280 360 520 520 820 420 S1170 480 1250 390"/>
  </g>

  <!-- Rising Sun / Habitat glow -->
  <circle cx="1020" cy="190" r="110" fill="rgba(212, 180, 118, 0.12)"/>
  <circle cx="1020" cy="190" r="75" fill="none" stroke="rgba(212, 180, 118, 0.28)" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Flying birds motif -->
  <g stroke="#d4b476" stroke-width="2.2" fill="none" opacity="0.6">
    <path d="M860 160 q20 -18 40 0 q20 -18 40 0"/>
    <path d="M930 120 q14 -12 28 0 q14 -12 28 0"/>
    <path d="M890 200 q11 -10 22 0 q11 -10 22 0"/>
  </g>

  <!-- Stamp Card / Emblem on Right -->
  <g transform="translate(860, 310)">
    <rect width="240" height="230" rx="8" fill="#102720" stroke="rgba(212, 180, 118, 0.35)" stroke-width="1.5"/>
    <circle cx="120" cy="95" r="54" fill="none" stroke="rgba(212, 180, 118, 0.5)" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="120" y="80" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" fill="#d4b476" letter-spacing="3">DEPARTMENT OF</text>
    <text x="120" y="102" text-anchor="middle" font-family="'Georgia', serif" font-size="19" font-weight="bold" fill="#ecd8b0">ZOOLOGY</text>
    <text x="120" y="120" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#d4b476" letter-spacing="2">JU · 2028</text>
    <text x="120" y="180" text-anchor="middle" font-family="'Georgia', serif" font-size="14" fill="#a8c5b9">Jahangirnagar University</text>
    <text x="120" y="202" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#7d9b90">DHAKA, BANGLADESH</text>
  </g>

  <!-- Left Content Column -->
  <g transform="translate(100, 140)">
    <!-- Eyebrow badge -->
    <rect width="295" height="32" rx="16" fill="rgba(236, 216, 176, 0.1)" stroke="rgba(236, 216, 176, 0.22)" stroke-width="1"/>
    <circle cx="18" cy="16" r="4.5" fill="#4ade80"/>
    <text x="32" y="21" font-family="'Courier New', monospace" font-size="13" fill="#ecd8b0" letter-spacing="1">FIELD NOTES / ZOOLOGY</text>

    <!-- Main Title -->
    <text x="0" y="105" font-family="'Georgia', serif" font-size="54" font-weight="normal" fill="#f8f4ec">
      Jannatul Nayem
    </text>

    <text x="0" y="165" font-family="'Georgia', serif" font-size="34" font-style="italic" fill="url(#goldGrad)">
      Learning to read the living landscape.
    </text>

    <!-- Subtitle / Focus Areas -->
    <text x="0" y="230" font-family="'Arial', sans-serif" font-size="19" fill="#c3d5cd" font-weight="300">
      Wildlife Conservation · Ecology · Biodiversity Monitoring · GIS
    </text>
    <text x="0" y="260" font-family="'Arial', sans-serif" font-size="16" fill="#88a89b">
      Jahangirnagar University · Department of Zoology
    </text>

    <!-- Tool tags -->
    <g transform="translate(0, 310)">
      <rect x="0" y="0" width="85" height="32" rx="4" fill="#183c31" stroke="rgba(212, 180, 118, 0.3)"/>
      <text x="42.5" y="21" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" fill="#ecd8b0">QGIS</text>

      <rect x="97" y="0" width="130" height="32" rx="4" fill="#183c31" stroke="rgba(212, 180, 118, 0.3)"/>
      <text x="162" y="21" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" fill="#ecd8b0">R / RStudio</text>

      <rect x="239" y="0" width="95" height="32" rx="4" fill="#183c31" stroke="rgba(212, 180, 118, 0.3)"/>
      <text x="286.5" y="21" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" fill="#ecd8b0">Python</text>

      <rect x="346" y="0" width="175" height="32" rx="4" fill="#183c31" stroke="rgba(212, 180, 118, 0.3)"/>
      <text x="433.5" y="21" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" fill="#ecd8b0">Species Monitoring</text>
    </g>

    <!-- Bottom metadata line -->
    <text x="0" y="410" font-family="'Courier New', monospace" font-size="14" fill="#7d9b90">
      Portfolio &amp; Fieldbook ➔ jannat.nay3m@gmail.com · linkedin.com/in/nay3m
    </text>
  </g>
</svg>
